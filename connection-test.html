<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>QABBILE | تست دسترسی</title><style>*{box-sizing:border-box}body{min-height:100vh;background:#0b0c0d;color:#f2e4cb;font:16px Tahoma,sans-serif;display:grid;place-items:center;margin:0;padding:24px}.panel{max-width:600px;width:100%;padding:32px;border:1px solid #8c734c;border-radius:20px;background:#171819;line-height:2.3}h1{font-size:25px}.gold{color:#dabc83}.muted{font-size:13px;color:#aaa49b}#state{padding:12px;border-radius:10px;background:#2e2920;white-space:pre-wrap}a{color:#f0cf89}</style></head><body><div class="panel"><div class="gold">QABBILE · اتصال آزمایشی</div><h1>تست بازشدن ژورنال بدون فیلترشکن</h1><p>اگر این صفحه از اینترنت ایران بدون VPN باز شده، میزبانی حداقل برای همین شبکه قابل دسترسی است.</p><div id="state">در حال بررسی حافظه مرورگر...</div><p class="muted">آزمایش زیر اطلاعات معامله را ذخیره نمی‌کند. این صفحه مستقل از برنامه اصلی است.</p><a href="./">ورود به ژورنال قبیله</a></div><script>(async()=>{let log=['آدرس سایت: '+location.hostname,'HTTPS: '+(location.protocol==='https:'?'فعال':'غیرفعال')];try{const k='qabbile_test_'+Date.now();localStorage.setItem(k,'ok');log.push('LocalStorage: '+(localStorage.getItem(k)==='ok'?'فعال':'غیرفعال'));localStorage.removeItem(k)}catch(e){log.push('LocalStorage: در این مرورگر مسدود است')}try{if(!('indexedDB' in window))throw Error();await new Promise((res,rej)=>{let r=indexedDB.open('qabbile_connection_test',1);r.onsuccess=()=>{r.result.close();indexedDB.deleteDatabase('qabbile_connection_test');res()};r.onerror=rej;r.onblocked=rej;setTimeout(()=>rej(Error('timeout')),2500)});log.push('IndexedDB: فعال')}catch(e){log.push('IndexedDB: در دسترس نیست')}document.getElementById('state').textContent=log.join('\n')})();</script></body></html>
